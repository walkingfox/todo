<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2430; --muted:#8a92a3; --accent:#4f6bed; --line:#e6e8ee; --danger:#e5484d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --card:#1d2027; --text:#e8eaf0; --muted:#7c8497; --accent:#7b93ff; --line:#2a2e38; --danger:#ff6369; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:28px; margin:0 0 24px; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input[type=text] { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:inherit; }
  input[type=text]:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; }
  .add { padding:0 18px; background:var(--accent); color:#fff; }
  .search { width:100%; margin-bottom:12px; }
  mark { background:color-mix(in srgb, var(--accent) 30%, transparent); color:inherit; border-radius:3px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { padding:6px 14px; background:transparent; color:var(--muted); }
  .tabs button.on { background:var(--card); color:var(--text); box-shadow:0 0 0 1px var(--line); }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border-radius:12px; border:1px solid var(--line); }
  li { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); cursor:pointer; }
  li span { flex:1; word-break:break-word; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li .del { background:none; color:var(--muted); font-size:18px; padding:2px 8px; }
  li .del:hover { color:var(--danger); }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  footer { display:flex; justify-content:space-between; margin-top:12px; color:var(--muted); font-size:14px; }
  footer button { background:none; color:var(--muted); padding:0; }
  footer button:hover { color:var(--danger); }
</style>
</head>
<body>
<main>
  <h1>할 일</h1>
  <form id="form">
    <input id="input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" autofocus>
    <button class="add" type="submit">추가</button>
  </form>
  <input id="search" type="text" class="search" placeholder="검색으로 항목 필터링" autocomplete="off">
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">전체</button>
    <button data-f="active">진행 중</button>
    <button data-f="done">완료</button>
  </div>
  <ul id="list"></ul>
  <footer>
    <span id="count"></span>
    <button id="clear">완료 항목 삭제</button>
  </footer>
</main>
<script>
  const KEY = 'todos-v1';
  let todos = [];
  try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}
  let filter = 'all';
  let query = '';

  const $ = id => document.getElementById(id);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {} };

  function render() {
    const q = query.trim().toLowerCase();
    const shown = todos.filter(t =>
      (filter === 'all' || (filter === 'done') === t.done) &&
      (!q || t.text.toLowerCase().includes(q)));
    const list = $('list');
    list.innerHTML = '';
    if (!shown.length) {
      list.innerHTML = '<li class="empty" style="display:block">항목이 없습니다</li>';
    }
    for (const t of shown) {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); render(); };
      const span = document.createElement('span');
      const i = q ? t.text.toLowerCase().indexOf(q) : -1;
      if (i < 0) {
        span.textContent = t.text;
      } else {
        const mark = document.createElement('mark');
        mark.textContent = t.text.slice(i, i + q.length);
        span.append(t.text.slice(0, i), mark, t.text.slice(i + q.length));
      }
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', '삭제');
      del.onclick = () => { todos = todos.filter(x => x !== t); save(); render(); };
      li.append(cb, span, del);
      list.append(li);
    }
    const left = todos.filter(t => !t.done).length;
    $('count').textContent = `남은 항목 ${left}개`;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
  }

  $('form').onsubmit = e => {
    e.preventDefault();
    const text = $('input').value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    $('input').value = '';
    save(); render();
  };
  $('search').oninput = e => { query = e.target.value; render(); };
  $('tabs').onclick = e => { if (e.target.dataset.f) { filter = e.target.dataset.f; render(); } };
  $('clear').onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };

  render();
</script>
</body>
</html>
